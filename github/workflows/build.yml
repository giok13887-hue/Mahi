name: Build Zoya APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept licenses and install SDK 35
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract project from ZIP
        run: |
          ls -la
          python3 -c "import glob,zipfile,os; zs=[f for f in glob.glob('*') if os.path.isfile(f) and zipfile.is_zipfile(f)]; assert zs, 'ZIP nahi mili'; v2=[f for f in zs if b'\"2.0\"' in zipfile.ZipFile(f).read('zoya-android/app/build.gradle.kts')]; pick=(v2 or zs)[0]; zipfile.ZipFile(pick).extractall('extracted'); print('Extracted:', pick)"
          ls extracted/zoya-android
      - name: Generate Gradle wrapper
        working-directory: extracted/zoya-android
        run: gradle wrapper --gradle-version 8.9
      - name: Build APK
        working-directory: extracted/zoya-android
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: extracted/zoya-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
